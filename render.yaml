services:
  # 1. React Frontend (Static Site - 100% Free)
  - type: web
    name: energypulse-web
    env: static
    plan: free
    buildCommand: cd energypulse-web && npm ci && npm run build
    staticPublishPath: ./energypulse-web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: energypulse-core
          property: url

  # 2. Spring Boot Core REST API (Docker Container - Free Plan)
  - type: web
    name: energypulse-core
    env: docker
    plan: free
    dockerfilePath: ./energypulse-core/Dockerfile
    context: ./energypulse-core
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx384m -Xms256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
      - key: POSTGRES_HOST
        fromDatabase:
          name: energypulse-postgres
          property: host
      - key: POSTGRES_DB
        fromDatabase:
          name: energypulse-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: energypulse-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: energypulse-postgres
          property: password
      - key: POSTGRES_PORT
        value: 5432
      - key: IGNITE_ENABLED
        value: "false"

  # 3. Sensor Simulator (Spring Boot Worker - Free Plan)
  - type: web
    name: energypulse-sensor-simulator
    env: docker
    plan: free
    dockerfilePath: ./sensor-simulator/Dockerfile
    context: ./sensor-simulator
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
      - key: SIMULATOR_INTERVAL_MS
        value: "10000"

databases:
  # PostgreSQL Managed Database (Free Plan)
  - name: energypulse-postgres
    databaseName: energypulse
    user: energypulse
    plan: free
